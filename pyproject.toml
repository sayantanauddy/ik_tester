[project]
name = "ik-tester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sayantan Auddy", email = "auddy@tu-berlin.de" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "imageio[tifffile]>=2.37.2",
    "mediapy>=1.2.4",
    "mujoco>=3.3.7",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
    "pytest>=9.0.1",
]

[project.scripts]
ik-tester = "ik_tester:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
